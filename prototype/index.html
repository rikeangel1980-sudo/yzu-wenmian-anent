<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问面 V2.0 · 交互原型（P05）</title>
<style>
/* ============ 基础重置 ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;color:#1e2a26;background:#f4f6f5;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.svg-ico{width:18px;height:18px;display:inline-block;vertical-align:-4px;flex:none}

/* ============ 三套主题变量 ============ */
body[data-scheme="A"]{
  --brand:#1b5e4a; --brand-2:#25775e; --brand-soft:#e7f1ec; --brand-ink:#0f3a2c;
  --bg:#f3f6f4; --card:#ffffff; --text:#1d2b25; --muted:#6b7c74; --line:#dfe8e3;
  --accent:#b5651d; --accent-soft:#fbf1e6; --ok:#1b7a4b; --warn:#b8791b; --danger:#b4342a;
  --radius:10px; --shadow:0 1px 3px rgba(20,50,38,.08); --nav-bg:#1d4739; --nav-ink:#eaf4ef; --nav-sub:#b9d3c7;
}
body[data-scheme="B"]{
  --brand:#3b5bdb; --brand-2:#5470e6; --brand-soft:#eef1fd; --brand-ink:#26357a;
  --bg:#f6f8fc; --card:#ffffff; --text:#1b2340; --muted:#6b7394; --line:#e4e8f3;
  --accent:#e8590c; --accent-soft:#fff1e9; --ok:#18864b; --warn:#c47c0c; --danger:#c02f27;
  --radius:14px; --shadow:0 4px 16px rgba(40,60,130,.07); --nav-bg:#ffffff; --nav-ink:#26357a; --nav-sub:#6b7394;
}
body[data-scheme="C"]{
  --brand:#d9480f; --brand-2:#e8622b; --brand-soft:#fff0e8; --brand-ink:#8a2f0b;
  --bg:#fffaf5; --card:#ffffff; --text:#2b1d16; --muted:#8a6f5c; --line:#f0e2d5;
  --accent:#2b8a3e; --accent-soft:#eaf6ec; --ok:#2b8a3e; --warn:#c47c0c; --danger:#b4342a;
  --radius:18px; --shadow:0 6px 20px rgba(120,60,20,.08); --nav-bg:#fff4ec; --nav-ink:#7a3410; --nav-sub:#a06a49;
}
body{background:var(--bg);color:var(--text)}

/* ============ 原型控制台（非产品界面） ============ */
#devbar{position:fixed;top:0;left:0;right:0;z-index:9999;background:#111827;color:#e5e7eb;
  display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#devbar .tag{font-weight:700;color:#fbbf24;letter-spacing:.5px;margin-right:4px}
#devbar .grp{display:flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid #374151}
#devbar .lbl{color:#9ca3af}
#devbar button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:6px;padding:4px 10px;font-size:12px}
#devbar button:hover{background:#374151}
#devbar button.on{background:#fbbf24;color:#111827;border-color:#fbbf24;font-weight:700}
#devbar .spacer{flex:1}
#devbar .hint{color:#6b7280}
body{padding-top:44px}

/* ============ 登录页 ============ */
.login-wrap{min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand-soft),var(--bg));padding:24px}
.login-card{width:100%;max-width:920px;display:grid;grid-template-columns:1.05fr .95fr;
  background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius) + 6px);overflow:hidden;box-shadow:var(--shadow)}
.login-aside{background:var(--brand);color:#fff;padding:44px 38px;display:flex;flex-direction:column;justify-content:space-between}
.login-aside h1{font-size:30px;margin:0 0 6px;font-weight:800;letter-spacing:1px}
.login-aside .sub{opacity:.85;font-size:14px;line-height:1.7}
.login-aside .feat{margin-top:28px;display:grid;gap:12px}
.login-aside .feat div{display:flex;gap:10px;align-items:center;opacity:.95;font-size:13px}
.login-aside .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9;flex:none}
.login-aside .foot{font-size:12px;opacity:.7}
.login-form{padding:44px 38px;display:flex;flex-direction:column;justify-content:center}
.login-form h2{margin:0 0 4px;font-size:22px}
.login-form .desc{color:var(--muted);margin:0 0 26px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg);color:var(--text);font-size:14px;outline:none}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.role-pick{display:flex;gap:8px;margin-bottom:20px}
.role-pick button{flex:1;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);font-size:13px}
.role-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.btn-primary{width:100%;padding:12px;border-radius:var(--radius);background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.btn-primary:hover{background:var(--brand-2)}
.login-tip{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

/* ============ 应用骨架 ============ */
.shell{min-height:calc(100vh - 44px)}
.appbar{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;padding:0 20px;position:sticky;top:44px;z-index:50}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--brand-ink)}
.logo .mark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px}
.appbar .search{margin-left:20px;flex:1;max-width:380px}
.appbar .search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg);outline:none;font-size:13px;color:var(--text)}
.appbar .spacer{flex:1}
.chip-role{background:var(--brand-soft);color:var(--brand-ink);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--bg)}

.layout{display:flex;min-height:calc(100vh - 44px - 58px)}
.sidebar{width:224px;flex:none;background:var(--nav-bg);color:var(--nav-ink);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.sidebar .nav-h{font-size:11px;letter-spacing:1px;color:var(--nav-sub);padding:12px 12px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--nav-ink);width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.09)}
.nav-item.on{background:var(--brand);color:#fff;font-weight:700}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
.sidebar .divider{height:1px;background:rgba(255,255,255,.12);margin:10px 6px}

.main{flex:1;min-width:0;padding:24px 28px;overflow:auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head h1{font-size:22px;margin:0 0 4px;font-weight:800}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12px;background:var(--brand-soft);color:var(--brand-ink)}
.pill.ok{background:#e6f4ea;color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--warn)}
.pill.danger{background:#fbe9e7;color:var(--danger)}
.pill.gray{background:var(--bg);color:var(--muted)}

/* ============ 卡片与网格 ============ */
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:800;color:var(--brand-ink)}
.stat .m{font-size:12px;color:var(--muted)}
.stat .ic{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:4px}
.sec-title{font-size:15px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title .more{margin-left:auto;font-size:12px;color:var(--brand);font-weight:600}

/* 学习主页 heroes */
.hero{background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;border-radius:calc(var(--radius) + 4px);
  padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.hero h2{margin:0 0 6px;font-size:21px}
.hero p{margin:0;opacity:.9;font-size:13px}
.hero .ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;
  background:conic-gradient(#fff 0 68%,rgba(255,255,255,.25) 68% 100%);position:relative;flex:none}
.hero .ring span{width:58px;height:58px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:15px}
.course-row{display:flex;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.course-cover{width:64px;height:64px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.course-meta{flex:1;min-width:0}
.course-meta h4{margin:0 0 5px;font-size:14px}
.course-meta .sub{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px;max-width:260px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:none}
.todo .t-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.todo .t-b{flex:1}
.todo .t-b h4{margin:0 0 3px;font-size:13.5px}
.todo .t-b .meta{font-size:12px;color:var(--muted)}
.todo .go{font-size:12px;color:var(--brand);font-weight:700;white-space:nowrap}
.notice{padding:10px 12px;border-radius:9px;background:var(--bg);font-size:12.5px;color:var(--muted);margin-bottom:8px}

/* 知识详情 */
.kd-head{display:flex;gap:16px;align-items:flex-start}
.kd-body{flex:1}
.kd-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.tag{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink)}
.src-card{background:var(--accent-soft);border:1px solid #f0dcbf;border-radius:var(--radius);padding:14px;font-size:13px;line-height:1.7}
.src-card .lbl{font-weight:700;color:var(--accent);font-size:12px;margin-bottom:6px}
.kd-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.list-line{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-line:last-child{border:none}
.list-line .idx{width:22px;height:22px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}

/* ============ 三栏图谱 ============ */
.graph-wrap{display:grid;grid-template-columns:230px 1fr 300px;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);height:560px}
.graph-left{border-right:1px solid var(--line);padding:14px;overflow:auto}
.graph-center{position:relative;background:
  radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:22px 22px;overflow:hidden}
.graph-right{border-left:1px solid var(--line);padding:16px;overflow:auto}
.graph-tools{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.graph-tools .tool{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow)}
.graph-tools .tool.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tree-item{padding:7px 8px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:7px;cursor:pointer}
.tree-item:hover{background:var(--bg)}
.tree-item.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.tree-item .tw{color:var(--muted);font-size:11px}
.gnode{position:absolute;width:104px;padding:9px 6px;border-radius:12px;background:var(--card);border:2px solid var(--brand);
  text-align:center;font-size:12px;box-shadow:var(--shadow);cursor:pointer;line-height:1.3}
.gnode.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.06)}
.gnode.dim{border-color:var(--line);color:var(--muted)}
.gnode small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.graph-legend{position:absolute;bottom:12px;left:12px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:var(--shadow)}
.graph-legend span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ============ 表格 / 题库 / 批改 ============ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar select,.filter-bar input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;outline:none}
.q-list{display:flex;flex-direction:column;gap:10px}
.q-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card);display:flex;gap:14px;align-items:flex-start}
.q-item .q-main{flex:1}
.q-item .q-stem{font-size:13.5px;margin-bottom:8px;line-height:1.6}
.q-item .q-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.mini-btn{padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:12px}
.mini-btn:hover{border-color:var(--brand)}
.mini-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.mini-btn.danger{color:var(--danger);border-color:#ecc}
.compose-grid{display:grid;grid-template-columns:1fr 1.1fr .9fr;gap:14px}
.compose-col h4{margin:0 0 10px;font-size:13px;color:var(--muted)}
.paper-q{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:12.5px;display:flex;gap:8px;align-items:center;background:var(--card)}
.paper-q .score{margin-left:auto;display:flex;gap:4px;align-items:center}
.paper-q input{width:46px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:center;background:var(--bg);color:var(--text)}
.grade-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.ai-box{background:var(--brand-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.ai-box .lbl{font-size:12px;font-weight:700;color:var(--brand-ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rubric-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rubric-row .dim{flex:1}
.rubric-row input{width:52px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:center;background:var(--card);color:var(--text)}
.final-score{font-size:26px;font-weight:800;color:var(--brand-ink)}

/* ============ 异常态 ============ */
.state-wrap{min-height:calc(100vh - 44px - 58px);display:grid;place-items:center;padding:24px}
.state-card{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius)+4px);
  padding:34px;text-align:center;box-shadow:var(--shadow)}
.state-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:var(--brand-soft);color:var(--brand)}
.state-ic.warn{background:var(--accent-soft);color:var(--accent)}
.state-ic.danger{background:#fbe9e7;color:var(--danger)}
.state-card h2{margin:0 0 10px;font-size:20px}
.state-card p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 22px}
.state-card .btn-primary{width:auto;padding:11px 22px;margin:0 4px}
.state-card .ghost{padding:11px 22px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px}

/* 骨架屏（加载中） */
.skeleton{display:grid;gap:12px}
.sk-line{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* 组卷蓝图统计数字 */
.blueprint{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bp{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.bp .v{font-size:18px;font-weight:800;color:var(--brand-ink)}
.bp .k{font-size:11px;color:var(--muted)}

/* 响应式 */
@media(max-width:1020px){.g-4{grid-template-columns:repeat(2,1fr)}.graph-wrap{grid-template-columns:180px 1fr}.graph-right{display:none}.compose-grid,.grade-grid,.kd-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-scheme="A">
<div id="devbar"></div>
<div id="root"></div>

<script>
/* =========================================================
   问面 V2.0 · P05 交互原型
   状态驱动渲染；三套方案（A/B/C）、双角色、多页面、异常态
   ========================================================= */
const S = {
  scheme: 'A',
  role: 'student',      // student | teacher
  page: 'login',        // 当前页面
  logged: false,
  forceState: null,     // 'expired' | 'loadfail' | 'forbidden' | 'loading'
  toast: ''
};

const ICON = {
  home:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  book:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg>',
  graph:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l3 9M16 7l-3 9M8.5 6h7"/></svg>',
  video:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-3v10l-4-3z"/></svg>',
  task:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  bank:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h16v3H4z"/></svg>',
  chart:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  user:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>',
  search:'<svg class="svg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',

function viewState(kind){
  let ic='',title='',desc='',acts='';
  if(kind==='expired'){
    ic='<svg class="svg-ico" style="width:30px;height:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>';
    title='登录状态已失效';
    desc='你的会话已过期，为保护学习数据请重新登录。登录后将从当前页面继续，不会丢失已作答内容。';
    acts='<button class="btn-primary" data-act="relogin">重新登录</button><button class="ghost" data-act="back">返回上一页</button>';
  } else if(kind==='loadfail'){
    ic='<svg class="svg-ico" style="width:30px;height:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';
    title='内容加载失败';
    desc='网络或接口暂时不可用，请求未能完成（错误码 NET-503）。请稍后重试；若持续失败请联系管理员。';
    acts='<button class="btn-primary" data-act="retry">重试加载</button><button class="ghost" data-act="back">返回首页</button>';
  } else if(kind==='forbidden'){
    ic='<svg class="svg-ico" style="width:30px;height:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>';
    title='无权访问该内容';
    desc='该资源不属于你授权的班级或课程范围，访问已被拒绝并记录。如需访问请联系教师开通权限。';
    acts='<button class="btn-primary" data-act="back">返回我的首页</button>';
  } else if(kind==='loading'){
    ic=''; title=''; desc=''; acts='';
  }
  if(kind==='loading'){
    return h`${pageHead(S.page)}<div class="card"><div class="skeleton">

/* ---------- Toast ---------- */
function toast(msg){
  let t=el('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10000;background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:opacity .2s';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0'},2200);
}

/* ---------- 渲染入口 ---------- */
function render(){
  document.body.setAttribute('data-scheme',S.scheme);
  renderDevbar();
  if(!S.logged){ el('root').innerHTML=viewLogin(); return; }
  el('root').innerHTML=viewShell(currentContent());
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-scheme],[data-role],[data-state],[data-go],[data-act],[data-node]');
  if(!b){return}
  if(b.hasAttribute('data-scheme')){S.scheme=b.dataset.scheme;render();return}
  if(b.hasAttribute('data-role')){
    S.role=b.dataset.role;
    if(!S.logged){render()}
    else{S.page='home';render()}
    return}
  if(b.hasAttribute('data-state')){
    S.forceState=b.dataset.state||null;render();return}
  if(b.hasAttribute('data-node')){
    toast('已选中节点：'+b.textContent.trim().split('\n')[0]+' · 右侧显示详情');return}
  if(b.hasAttribute('data-go')){
    const g=b.dataset.go;
    if(g==='login'){S.logged=false;S.forceState=null;S.page='login';render();return}
    S.page=g;S.forceState=null;render();return}
  if(b.hasAttribute('data-act')){
    const a=b.dataset.act;
    switch(a){
      case 'login': S.logged=true;S.forceState=null;S.page='home';render();toast('登录成功：'+(S.role==='student'?'学生学习端':'教师工作台'));break;
      case 'logout': S.logged=false;S.page='login';render();toast('已退出，会话不可复用');break;
      case 'relogin': S.forceState=null;render();toast('已重新登录，从原页面继续');break;
      case 'back': S.forceState=null;render();break;
      case 'retry': S.forceState=null;render();toast('重新加载成功');break;
      case 'submit': case 'submit-work': toast('已提交，重复提交不会重复计分');break;
      case 'approve': toast('已通过审核 · 操作已留痕（操作者/时间/对象）');break;
      case 'reject': toast('已退回候选题 · 原因与操作已留痕');break;
      case 'generate': toast('已生成 5 道候选题 · 均为待审核，未入库');break;
      case 'preview': case 'preview-paper': case 'play': toast('预览/播放已触发（演示环境，无真实媒体）');break;
      case 'upload': toast('上传入口已打开（演示）');break;
      case 'listview': toast('已切换到列表视图 · 无需画布仍可浏览与审核');break;
      case 'save-draft': toast('批改草稿已保存 · 未发布');break;
      case 'publish-grade': toast('成绩已发布 · 学生端可见，更正值留痕');break;
      case 'add-q': toast('已加入试卷 · 蓝图统计同步更新');break;
      case 'rule': case 'ai-compose': toast(a==='rule'?'规则组卷：按蓝图自动抽题':'AI 辅助：仅用已审核题或标记候选');break;
      case 'up': case 'down': toast('题目顺序已调整（支持键盘操作）');break;
      case 'prev': case 'next': toast('已切换题目 · 作答自动保存');break;
      case 'bell': toast('暂无新通知');break;
      case 'settings': toast('个人设置（演示）');break;
      default: toast('操作已触发：'+a);
    }
    return}
});
// 组卷分值联动总分
document.addEventListener('input',e=>{
  if(e.target.hasAttribute('data-score')){
    let sum=0;document.querySelectorAll('[data-score]').forEach(i=>sum+=Number(i.value)||0);
    const t=el('totalScore');if(t)t.textContent=sum;
  }
  if(e.target.hasAttribute('data-grade')){
    let sum=0;document.querySelectorAll('[data-grade]').forEach(i=>sum+=Number(i.value)||0);
    const t=el('finalScore');if(t)t.textContent=sum;
  }
});

/* ---------- 启动（支持 hash 直达，便于体验与测试） ----------
   格式：#scheme=A&role=student&page=home&logged=1&state=expired
   state 取：expired|loadfail|forbidden|loading                     */
(function initFromHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/,''));
  if(p.get('scheme') && ['A','B','C'].includes(p.get('scheme'))) S.scheme=p.get('scheme');
  if(p.get('role')) S.role=p.get('role');
  if(p.get('page')) S.page=p.get('page');
  if(p.get('logged')==='1') S.logged=true;
  if(p.get('state')) S.forceState=p.get('state');
})();
render();
</script>
